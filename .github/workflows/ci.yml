# Verificación en cada push y PR: typecheck + tests (contraste, catálogo, React, json-render) + build.
name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
