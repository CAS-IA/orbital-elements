# Publica en npmjs.com (público, con provenance) al subir una etiqueta vX.Y.Z.
# Requiere el secreto NPM_TOKEN (npmjs.com → Access Tokens → Granular, permiso de escritura en @cas-ia).
# La etiqueta debe coincidir con la versión de package.json.
name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: La etiqueta coincide con package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run verify
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
