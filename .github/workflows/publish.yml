# Publica en GitHub Packages al subir una etiqueta vX.Y.Z (con el GITHUB_TOKEN del repo,
# sin tokens personales). La etiqueta debe coincidir con la versión de package.json.
name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@cas-ia'
      - name: La etiqueta coincide con package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run verify
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
